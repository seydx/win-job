[package]
edition = "2021"
name = "seydx-win-job"
version = "0.0.0"

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "3.14.2", default-features = false, features = ["napi9"] }
napi-derive = "3.6.12"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
] }

[build-dependencies]
napi-build = "2.6.0"

[profile.release]
lto = true
strip = "symbols"
codegen-units = 1
